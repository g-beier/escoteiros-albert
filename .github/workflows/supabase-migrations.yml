# Applies apps/financeiro/supabase/migrations to the production Supabase project
# (shared by financeiro and inventario) after CI passes on main.
# Only migrations: auth settings (site URL, redirects, email template, before_user_created
# hook) are set in the Supabase dashboard; never `supabase config push` (config.toml is local).
name: Supabase migrations

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: apps/financeiro
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the commit CI tested, not whatever main is now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations
        run: supabase migration list --remote
      - name: Apply migrations
        run: supabase db push --remote
