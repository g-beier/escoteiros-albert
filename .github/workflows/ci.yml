# CI only: lint, types, tests and builds. The site goes up by manual FTP; production
# migrations are applied by Supabase's GitHub integration.
#
# Manual only while apps/financeiro + apps/inventario become apps/gestao and hosting is being
# chosen (docs/consolidacao-gestao.md): nothing runs on push or PR. Restore the push/pull_request
# triggers when the new hosting is in place.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # no group database in CI: the site builds without the Realizado section
          TRANSPARENCY_SKIP: '1'

  db-e2e:
    name: SQL tests (pgTAP) and e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/gestao
    env:
      SUPABASE_BIN: supabase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - run: npm ci
        working-directory: .
      - name: Start local Supabase
        run: supabase start -x studio,postgres-meta,realtime,edge-runtime,logflare,vector,supavisor,imgproxy
      - name: SQL tests
        run: supabase test db
      - name: Write .env.local
        run: npm run infra:env
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/gestao/playwright-report
            apps/gestao/test-results
          retention-days: 7
