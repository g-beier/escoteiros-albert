# CI only: lint, types, tests and builds. Nothing deploys from here: the site goes up by manual
# FTP and production migrations are applied by hand (`npm run db:migrate`, see CLAUDE.md, CI/CD).
#
# The jobs below are required status checks in the "main: PR e checks" ruleset (CONTRIBUTING.md):
# renaming a job's `name` means updating the ruleset too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # no group database in CI: the site builds without the Realizado section
          TRANSPARENCY_SKIP: '1'

  db-e2e:
    name: SQL tests (pgTAP) and e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/gestao
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      # Postgres 17 + pgTAP and Azurite (db/compose.yaml); applies the migrations and writes .env.local
      - name: Start local database and storage
        run: npm run infra:start
      - name: SQL tests
        run: npm run test:db
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/gestao/playwright-report
            apps/gestao/test-results
          retention-days: 7
